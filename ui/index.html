<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="presence-widget">
      <button
        class="orb-viewport"
        id="talk-button"
        type="button"
        aria-label="Start talking to Byte"
        title="Click to talk · Ctrl+B"
      >
        <canvas id="byte-orb-canvas" width="220" height="175" aria-hidden="true"></canvas>
      </button>

      <div class="status-badge">
        <span id="status-text" role="status" aria-live="polite"></span>
        <button class="wake-toggle" id="wake-toggle" type="button" aria-label="Wake word setting is loading" title="Wake word" aria-pressed="false" aria-busy="true" disabled>◉</button>
        <button class="text-toggle" id="text-toggle" type="button" aria-label="Send a message" title="Send a message" aria-expanded="false">
          ⌨
        </button>
        <button class="model-settings-toggle" id="model-settings-toggle" type="button" aria-label="Model settings" title="Model settings">⚙</button>
      </div>
    </div>

    <section class="conversation-panel" id="conversation-panel" aria-label="Conversation" hidden>
      <header class="conversation-header">
        <span class="conversation-title">Message Byte</span>
        <button id="text-close" type="button" aria-label="Close conversation">×</button>
      </header>
      <div id="chat-view" class="panel-view">
        <form class="text-form" id="text-form">
          <textarea id="text-input" rows="2" maxlength="4000" aria-label="Message Byte" placeholder="Type a message…"></textarea>
          <div class="text-form-footer">
            <span id="text-feedback" role="status" aria-live="polite">Byte will speak its reply.</span>
            <button id="text-send" type="submit">Send</button>
          </div>
        </form>
      </div>
    </section>

    <section class="conversation-panel model-setup-panel" id="model-setup-panel" aria-label="AI model setup" hidden>
      <header class="conversation-header">
        <span class="conversation-title" id="model-setup-title">Choose how Byte works</span>
        <button id="model-setup-close" type="button" aria-label="Close model settings">×</button>
      </header>
      <form class="model-setup-form" id="model-setup-form">
        <label>Model type
          <select id="model-provider">
            <option value="ollama">Local · Ollama</option>
            <option value="cloud">Cloud · API</option>
          </select>
        </label>
        <p class="model-privacy" id="model-privacy"></p>
        <div id="local-model-fields" class="model-fields">
          <label>Ollama endpoint<input id="ollama-url" type="url" autocomplete="url" required /></label>
          <label>Chat model<input id="ollama-model" type="text" maxlength="120" required /></label>
          <label>Vision model<input id="vision-model" type="text" maxlength="120" /></label>
        </div>
        <div id="cloud-model-fields" class="model-fields" hidden>
          <label>API endpoint<input id="cloud-url" type="url" autocomplete="url" /></label>
          <label>Chat model<input id="cloud-model" type="text" maxlength="120" /></label>
          <label>Vision model <span class="optional-label">(optional)</span><input id="cloud-vision-model" type="text" maxlength="120" /></label>
          <label>API key<input id="cloud-api-key" type="password" autocomplete="new-password" placeholder="Paste your provider API key" /></label>
          <span id="cloud-key-note" class="model-key-note"></span>
        </div>
        <div class="model-setup-footer">
          <span id="model-setup-feedback" role="status" aria-live="polite"></span>
          <button id="model-setup-save" type="submit">Save</button>
        </div>
      </form>
    </section>

    <script src="orb.js"></script>
    <script src="main.js"></script>
  </body>
</html>
