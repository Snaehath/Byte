<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="presence-widget" data-tauri-drag-region>
      <!-- Living Audio-Reactive Canvas Orb -->
      <div class="orb-viewport" data-tauri-drag-region>
        <canvas id="byte-orb-canvas" width="220" height="175"></canvas>
      </div>

      <!-- Minimal Ambient Presence Status -->
      <div class="status-badge">
        <span id="status-text">Click or Ctrl+B</span>
      </div>
    </div>

    <script src="orb.js"></script>
    <script src="main.js"></script>
  </body>
</html>
